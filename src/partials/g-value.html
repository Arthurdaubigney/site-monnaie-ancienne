<figure class="fig reveal">
  <svg viewBox="0 0 560 340" role="img" aria-labelledby="gv-t gv-d" class="chart">
    <title id="gv-t">Valeur du métal et prime numismatique</title>
    <desc id="gv-d">Schéma illustratif : trois pièces d’or ont la même valeur de métal, mais une prime numismatique croissante selon leur rareté.</desc>
    <defs>
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#d8b878"/><line x1="0" y1="0" x2="0" y2="7" stroke="#b48a43" stroke-width="3"/></pattern>
    </defs>
    <g class="gridlines"><line x1="40" x2="540" y1="60" y2="60"/><line x1="40" x2="540" y1="120" y2="120"/><line x1="40" x2="540" y1="180" y2="180"/><line x1="40" x2="540" y1="240" y2="240"/></g>
    <line class="axis" x1="40" x2="540" y1="280" y2="280"/>
    <g class="bars">
      <g class="bar" style="--d:0"><rect class="metal" x="80" y="214" width="96" height="66" rx="4"/><rect class="prime" x="80" y="190" width="96" height="24" rx="4"/></g>
      <g class="bar" style="--d:1"><rect class="metal" x="232" y="214" width="96" height="66" rx="4"/><rect class="prime" x="232" y="120" width="96" height="94" rx="4"/></g>
      <g class="bar" style="--d:2"><rect class="metal" x="384" y="214" width="96" height="66" rx="4"/><rect class="prime" x="384" y="40" width="96" height="174" rx="4"/></g>
    </g>
    <g class="lbl" text-anchor="middle"><text x="128" y="306">Pièce courante</text><text x="280" y="306">Pièce recherchée</text><text x="432" y="306">Rareté</text></g>
    <g class="lbl-sm" text-anchor="middle"><text x="128" y="324">millésime fréquent</text><text x="280" y="324">belle conservation</text><text x="432" y="324">variété rare</text></g>
  </svg>
  <ul class="legend"><li><i class="sw metal"></i>Valeur du métal précieux</li><li><i class="sw prime"></i>Prime numismatique</li></ul>
  <figcaption>Schéma illustratif : à poids d’or égal, la prime de collection varie fortement selon la rareté et l’état de conservation.</figcaption>
</figure>
